# Eldock – produkční nasazení (Hetzner Cloud VPS i on-premise server v továrně)
#
#   cp .env.production.example .env.production   # doplnit heslo, tajemství a domény
#   docker compose --env-file .env.production up -d --build
#
# Data zůstávají na hostiteli v ./data (zálohujte celý adresář):
#   ./data/db       SQLite databáze (eldock.db)
#   ./data/storage  nahrané fotky, revize, schémata a vygenerované dokumenty
#   ./data/backups  denní snímky databáze (fáze 68; šifrovaně s ELDOCK_BACKUP_KEY, mimo server přes ELDOCK_BACKUP_S3_*)
#   ./data/caddy    certifikáty Let's Encrypt a stav Caddy

name: eldock

services:
  eldock-app:
    build: .
    image: eldock:latest
    container_name: eldock-app
    restart: unless-stopped
    environment:
      DATABASE_URL: file:/app/data/db/eldock.db
      ELDOCK_ACCESS_PASSWORD: ${ELDOCK_ACCESS_PASSWORD:?Nastavte ELDOCK_ACCESS_PASSWORD v .env.production}
      ELDOCK_AUTH_SECRET: ${ELDOCK_AUTH_SECRET:?Nastavte ELDOCK_AUTH_SECRET (openssl rand -base64 32)}
      # 1 = při prvním startu nad prázdnou databází nahrát demo data, 0 = začít s prázdnou aplikací
      ELDOCK_SEED_DEMO: ${ELDOCK_SEED_DEMO:-1}
      # 1 = cookie bez příznaku Secure (jen provoz bez HTTPS v uzavřené síti)
      ELDOCK_INSECURE_COOKIE: ${ELDOCK_INSECURE_COOKIE:-0}
      # 1 = skrýt přepínač účtů – uživatel zůstane v účtu, pod kterým se přihlásil (0 = obchodní demo)
      ELDOCK_LOCK_ACCOUNT_SWITCHER: ${ELDOCK_LOCK_ACCOUNT_SWITCHER:-0}
      # Avízo lhůt revizí: SMTP (bez něj se e-mail uloží jen do logu) a token pro cron
      ELDOCK_SMTP_URL: ${ELDOCK_SMTP_URL:-}
      ELDOCK_MAIL_FROM: ${ELDOCK_MAIL_FROM:-Eldock <noreply@eldock.cz>}
      ELDOCK_CRON_SECRET: ${ELDOCK_CRON_SECRET:-}
      ELDOCK_PUBLIC_URL: ${ELDOCK_PUBLIC_URL:-https://eldock.cz}
      # Velín /superadmin (fáze 50): bez vlastního hesla je v produkci vypnutý; IBAN pro QR platbu kreditů
      ELDOCK_SUPERADMIN_PASSWORD: ${ELDOCK_SUPERADMIN_PASSWORD:-}
      ELDOCK_BANK_IBAN: ${ELDOCK_BANK_IBAN:-}
      # Fáze 56: Google Analytics 4 (ID měření G-…) – načte se jen po souhlasu s analytickými cookies; prázdné = bez analytiky a bez lišty
      ELDOCK_GA4_ID: ${ELDOCK_GA4_ID:-}
      # Fáze 102: měření a marketing jen po souhlasu v liště cookies (Google Consent Mode v2); čte je server (/api/consent),
      # prázdné = služba vypnutá. NEXT_PUBLIC_GA_MEASUREMENT_ID má přednost před ELDOCK_GA4_ID.
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
      NEXT_PUBLIC_CLARITY_ID: ${NEXT_PUBLIC_CLARITY_ID:-}
      NEXT_PUBLIC_SKLIK_ID: ${NEXT_PUBLIC_SKLIK_ID:-}
      NEXT_PUBLIC_GOOGLE_ADS_ID: ${NEXT_PUBLIC_GOOGLE_ADS_ID:-}
      NEXT_PUBLIC_LINKEDIN_PARTNER_ID: ${NEXT_PUBLIC_LINKEDIN_PARTNER_ID:-}
      # AI Panel Builder: bez klíče běží deterministický demo režim
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_VISION_MODEL: ${GEMINI_VISION_MODEL:-gemini-3.1-pro-preview}
      GEMINI_DATASHEET_MODEL: ${GEMINI_DATASHEET_MODEL:-gemini-2.5-flash}
      # Fáze 68: denní záloha a retence v procesu aplikace (0 = vypnout), heslo šifrování a úložiště mimo server (S3)
      ELDOCK_BACKUP: ${ELDOCK_BACKUP:-1}
      ELDOCK_BACKUP_TIME: ${ELDOCK_BACKUP_TIME:-02:30}
      ELDOCK_BACKUP_DIR: /app/data/backups
      ELDOCK_BACKUP_KEEP_LOCAL: ${ELDOCK_BACKUP_KEEP_LOCAL:-7}
      ELDOCK_BACKUP_KEY: ${ELDOCK_BACKUP_KEY:-}
      ELDOCK_BACKUP_S3_ENDPOINT: ${ELDOCK_BACKUP_S3_ENDPOINT:-}
      ELDOCK_BACKUP_S3_REGION: ${ELDOCK_BACKUP_S3_REGION:-}
      ELDOCK_BACKUP_S3_BUCKET: ${ELDOCK_BACKUP_S3_BUCKET:-}
      ELDOCK_BACKUP_S3_ACCESS_KEY: ${ELDOCK_BACKUP_S3_ACCESS_KEY:-}
      ELDOCK_BACKUP_S3_SECRET_KEY: ${ELDOCK_BACKUP_S3_SECRET_KEY:-}
      ELDOCK_BACKUP_S3_PREFIX: ${ELDOCK_BACKUP_S3_PREFIX:-eldock}
      ELDOCK_BACKUP_S3_PATH_STYLE: ${ELDOCK_BACKUP_S3_PATH_STYLE:-0}
      ELDOCK_BACKUP_KEEP_DAILY: ${ELDOCK_BACKUP_KEEP_DAILY:-14}
      ELDOCK_BACKUP_KEEP_MONTHLY: ${ELDOCK_BACKUP_KEEP_MONTHLY:-6}
    volumes:
      - ./data/db:/app/data/db
      - ./data/storage:/app/storage
      - ./data/backups:/app/data/backups
    # Aplikace je dostupná jen uvnitř sítě Compose – ven ji publikuje Caddy.
    expose:
      - "3000"
    networks: [eldock]

  caddy:
    image: caddy:2.10-alpine
    container_name: eldock-caddy
    restart: unless-stopped
    depends_on:
      - eldock-app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      # Domény, pro které Caddy vystaví a obnovuje certifikát Let's Encrypt (oddělené čárkou a mezerou).
      # On-premise bez internetu: ELDOCK_DOMAINS=":80" (jen HTTP v uzavřené síti, + ELDOCK_INSECURE_COOKIE=1),
      # nebo interní název serveru a v Caddyfile `tls internal` (vlastní certifikační autorita Caddy) – viz README.
      ELDOCK_DOMAINS: ${ELDOCK_DOMAINS:-eldock.cz, www.eldock.cz, app.eldock.cz}
      ELDOCK_ACME_EMAIL: ${ELDOCK_ACME_EMAIL:-admin@eldock.cz}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    networks: [eldock]

networks:
  eldock:
