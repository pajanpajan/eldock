# Fáze 73: kontrolní sestavení aplikace Eldock pro iOS (simulátor, bez podpisu) a její spuštění v simulátoru iPhonu
# a iPadu – spouští se jen ručně (Actions → „iOS – sestavení pro simulátor“ → Run workflow). Repozitář je veřejný,
# minuty macOS jsou zdarma. Capacitor 8 potřebuje Xcode 26 nebo novější: macos-26 ho má jako výchozí, macos-15-intel
# (záloha, když GitHubu chybí runnery Apple Silicon) má výchozí Xcode 16, proto krok níže vybere nejnovější
# nainstalované Xcode 26. Spuštění (apps/client/scripts/ios-simulator.mjs) vyfotí úvodní obrazovku bez spárování –
# nic se nepáruje ani neposílá na eldock.cz – a selže, když aplikace spadne, Capacitor nahlásí chybu JavaScriptu /
# WebView nebo obrazovka zůstane prázdná či bílá. Snímky: artefakty eldock-iphone.png a eldock-ipad.png (bez zipu),
# vše včetně záznamů: artefakt eldock-ios-simulator.
# Podepsané sestavení pro iPhone a TestFlight až s účtem Apple Eldock s.r.o.
name: iOS – sestavení pro simulátor

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner macOS (macos-15-intel jako záloha při nedostatku runnerů Apple Silicon)
        type: choice
        options:
          - macos-26
          - macos-15-intel
        default: macos-26

permissions:
  contents: read

jobs:
  ios-simulator:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/client/package-lock.json
      - name: Xcode 26 nebo novější
        run: |
          major=$(xcodebuild -version | awk 'NR==1 { split($2, v, "."); print v[1] }')
          if [ "$major" -lt 26 ]; then
            xcode=$(ls -d /Applications/Xcode_26*.app | grep -iv beta | sort -V | tail -n 1)
            [ -n "$xcode" ] || { echo "::error::Na runneru chybí Xcode 26 – Capacitor 8 ho vyžaduje"; exit 1; }
            sudo xcode-select -s "$xcode"
          fi
          xcodebuild -version
      # Rozhraní aplikace bere sdílené moduly webu ze src/ (štítky, formáty) a jejich závislosti z kořene
      - name: Závislosti webu
        run: npm ci --ignore-scripts
      - name: Závislosti aplikace
        working-directory: apps/client
        run: npm ci --ignore-scripts
      - name: Rozhraní do projektu iOS
        working-directory: apps/client
        run: npx vite build && npx cap sync ios
      # -derivedDataPath: App.app pro další krok v ios/App/build/Build/Products/Debug-iphonesimulator (v .gitignore)
      - name: Xcode – simulátor bez podpisu
        working-directory: apps/client/ios/App
        run: xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination "generic/platform=iOS Simulator" -derivedDataPath build CODE_SIGNING_ALLOWED=NO -quiet build
      - name: Spuštění v simulátoru iPhonu a iPadu
        working-directory: apps/client
        run: node scripts/ios-simulator.mjs ios/App/build/Build/Products/Debug-iphonesimulator/App.app "$RUNNER_TEMP/eldock-ios-simulator"
      # Snímky i samostatně bez zipu (archive: false – název artefaktu = název souboru), jdou otevřít rovnou
      - name: Snímek iPhonu
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/eldock-ios-simulator/eldock-iphone.png
          archive: false
          if-no-files-found: ignore
          retention-days: 30
      - name: Snímek iPadu
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/eldock-ios-simulator/eldock-ipad.png
          archive: false
          if-no-files-found: ignore
          retention-days: 30
      - name: Snímky a záznamy ze simulátoru
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: eldock-ios-simulator
          path: ${{ runner.temp }}/eldock-ios-simulator
          if-no-files-found: ignore
          retention-days: 30
